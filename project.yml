name: UltimateCAM
options:
  bundleIdPrefix: local.ultimatecam
  deploymentTarget:
    iOS: '18.0'
targets:
  UltimateCAM:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Legal
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ultimate CAM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: UltimateCAM necesita la cámara para tomar fotografías.
        NSMicrophoneUsageDescription: Ultimate CAM usa el micrófono solo cuando eliges grabar vídeo con audio.
        NSMotionUsageDescription: Ultimate CAM usa la orientación del teléfono para guiar y unir las fotos de una esfera.
        NSPhotoLibraryAddUsageDescription: UltimateCAM guarda las fotos que elijas y su referencia original.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokuencinar.ultimatecam
        MARKETING_VERSION: '0.13.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: '1'
        SWIFT_VERSION: '5.0'
        SWIFT_OBJC_BRIDGING_HEADER: Sources/UltimateCAM-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      gatherCoverageData: false
  UltimateCAMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UltimateCAM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gokuencinar.ultimatecam.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UltimateCAM
        SWIFT_VERSION: '5.0'
schemes:
  UltimateCAM-UI:
    build:
      targets:
        UltimateCAM: all
        UltimateCAMUITests: [test]
    test:
      targets: [UltimateCAMUITests]
