name: Vista de Ultimate CAM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Capture interface on iPhone 11 Pro simulator
        timeout-minutes: 35
        run: bash scripts/capture_ui.sh
      - name: Temporary simulator views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-ui-${{ github.run_number }}
          path: |
            build/ui/*.png
            build/ui/attachments/**/*.png
          if-no-files-found: ignore
          retention-days: 1
