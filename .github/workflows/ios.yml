name: iOS · Ultimate CAM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode and XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          for tool in ldid dpkg-deb; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              if [ "$tool" = dpkg-deb ]; then brew install dpkg; else brew install ldid; fi
            fi
          done
          xcodegen generate
      - name: Build for iPhone without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project UltimateCAM.xcodeproj \
            -scheme UltimateCAM -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
      - name: Check image alignment and noise averaging
        run: |
          set -euo pipefail
          SOURCES=(Sources/TemporalFrameBuffer.swift Sources/ResearchWiener.swift Sources/CaptureRotation.swift Sources/CaptureMetadata.swift Sources/SphereViewerRenderer.swift Sources/SphereGeometry.swift Sources/SphereMetadata.swift Sources/SphereProcessor.swift Sources/PanoramaProcessor.swift Sources/PortraitProcessor.swift Sources/PreviewAnalysis.swift Sources/MovieConfiguration.swift Sources/MovieRecordedAsset.swift Sources/AdaptiveHDR.swift Sources/PNGLUT.swift Sources/PhotoCapturePolicy.swift Sources/WeightedTemporalMerger.swift Sources/ImportedPhotoProcessor.swift Sources/ColorRecipe.swift Sources/HDRCapturePlan.swift Sources/HDRProcessor.swift Sources/JPEGRenderer.swift Sources/NightCapturePlan.swift Sources/ProcessingCancellation.swift Sources/PreviewDecoder.swift Sources/ProcessingOptions.swift Sources/CubeLUT.swift Sources/ProcessingProfiles.swift Sources/AdvancedProcessor.swift Sources/LocalAlignment.swift Sources/NoiseAwareMerger.swift Sources/ImageStatistics.swift Sources/BurstProcessor.swift)
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/PortChecks.swift -o build/port-checks
          build/port-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/ProcessorChecks.swift -o build/processor-checks
          build/processor-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/MovieChecks.swift -o build/movie-checks
          build/movie-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/PanoramaChecks.swift -o build/panorama-checks
          build/panorama-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/SphereChecks.swift -o build/sphere-checks
          build/sphere-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/SpectralChecks.swift -o build/spectral-checks
          build/spectral-checks
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Sources/SensorBayerFrame.swift Tests/ComputationalChecks.swift -o build/computational-checks
          build/computational-checks
      - name: Package rootless DEB
        run: bash scripts/package_deb.sh
      - name: Package RootHide DEB
        run: bash scripts/package_deb.sh roothide
      - name: Validate both package layouts
        run: python3 Tests/PackageChecks.py build
      - name: Upload rootless DEB
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-rootless-${{ github.run_number }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-roothide-${{ github.run_number }}
          path: build/roothide/*.deb
          if-no-files-found: error
          retention-days: 14
