name: iOS · Ultimate CAM

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_preview:
        description: Generate simulator screenshots
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode and XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          for tool in ldid dpkg-deb; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              if [ "$tool" = dpkg-deb ]; then brew install dpkg; else brew install ldid; fi
            fi
          done
          xcodegen generate
      - name: Build for iPhone without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project UltimateCAM.xcodeproj \
            -scheme UltimateCAM -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build 2>&1 | tee build/xcodebuild.log
      - name: Check image alignment and noise averaging
        run: |
          set -euo pipefail
          SOURCES=(Sources/ColorRecipe.swift Sources/HDRCapturePlan.swift Sources/HDRProcessor.swift Sources/JPEGRenderer.swift Sources/NightCapturePlan.swift Sources/ProcessingCancellation.swift Sources/PreviewDecoder.swift Sources/ProcessingOptions.swift Sources/CubeLUT.swift Sources/ProcessingProfiles.swift Sources/AdvancedProcessor.swift Sources/LocalAlignment.swift Sources/NoiseAwareMerger.swift Sources/ImageStatistics.swift Sources/BurstProcessor.swift)
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/PortChecks.swift -o build/port-checks
          build/port-checks 2>&1 | tee build/port-checks.log
          xcrun --sdk macosx swiftc -O "${SOURCES[@]}" Tests/ProcessorChecks.swift -o build/processor-checks
          ULTIMATECAM_PROCESSOR_TRACE=1 build/processor-checks 2>&1 | tee build/processor-checks.log
      - name: Package rootless DEB
        run: bash scripts/package_deb.sh
      - name: Build read-only device diagnostic
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=18.0 -O2 scripts/device_state.c -o build/diagnostics/UltimateCAM-device-state
          ldid -S build/diagnostics/UltimateCAM-device-state
          cd build/diagnostics
          shasum -a 256 UltimateCAM-device-state > SHA256SUMS.txt
      - name: Upload device diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-diagnostics-${{ github.run_number }}
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Upload DEB and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-rootless-${{ github.run_number }}
          path: |
            build/*.deb
            build/SHA256SUMS.txt
            build/BUILD.txt
          if-no-files-found: error
          retention-days: 14
      - name: Capture interface on iPhone 11 Pro simulator
        if: github.event_name == 'workflow_dispatch' && inputs.ui_preview
        timeout-minutes: 8
        run: bash scripts/capture_ui.sh
      - name: Upload interface previews
        if: always() && github.event_name == 'workflow_dispatch' && inputs.ui_preview
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-interface-${{ github.run_number }}
          path: build/ui/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-build-log-${{ github.run_number }}
          path: |
            build/xcodebuild.log
            build/processor-checks.log
            build/port-checks.log
          if-no-files-found: warn
          retention-days: 14
