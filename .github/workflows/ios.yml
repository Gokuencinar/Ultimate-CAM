name: iOS · Ultimate CAM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode and XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          for tool in ldid dpkg-deb; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              if [ "$tool" = dpkg-deb ]; then brew install dpkg; else brew install ldid; fi
            fi
          done
          xcodegen generate
      - name: Check computational formats
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun --sdk macosx swiftc -g -O -import-objc-header Sources/FusionMath.h Sources/CameraFailure.swift Sources/CaptureProgress.swift Sources/PreviewReferenceSelector.swift Sources/TemporalFrameBuffer.swift Sources/BayerScratchStorage.swift Sources/DNGMetadata.swift Sources/SensorBayerFrame.swift Sources/SuperResolution.swift Sources/LensCalibration.swift Sources/HDRCapturePlan.swift Sources/NightCapturePlan.swift Sources/NightTonePlan.swift Sources/ProcessingOptions.swift Sources/PhotoModePolicy.swift Sources/PhotoCapturePolicy.swift Sources/ColorRecipe.swift Sources/CubeLUT.swift Tests/ComputationalChecks.swift -o build/computational-checks
          build/computational-checks
      - name: Check GPU pipeline and optical joins
        run: bash scripts/check_host.sh gpu
      - name: Build for iPhone without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project UltimateCAM.xcodeproj \
            -scheme UltimateCAM -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
      - name: Check image alignment and noise averaging
        run: bash scripts/check_host.sh rest
      - name: Package rootless DEB
        run: bash scripts/package_deb.sh
      - name: Package RootHide DEB
        run: bash scripts/package_deb.sh roothide
      - name: Validate both package layouts
        run: python3 Tests/PackageChecks.py build
      - name: Upload rootless DEB
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-rootless-${{ github.run_number }}
          path: build/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload RootHide DEB
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-CAM-roothide-${{ github.run_number }}
          path: build/roothide/*.deb
          if-no-files-found: error
          retention-days: 14
